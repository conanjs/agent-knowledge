# Runs npm run verify-before-commit (the validator over knowledge/, then the tools' scenarios) on every pull request
# and push to main. Actions are pinned to a full commit SHA, with the release tag as a comment; Dependabot
# (.github/dependabot.yml) proposes updates.
name: knowledge checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-before-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npm run verify-before-commit
